[build]
  # 构建命令
  command = "npm run build"
  # 发布目录
  publish = "dist"

# 函数超时配置（如果使用 Netlify Functions）
[functions]
  # 函数超时时间（秒），最大 26 秒
  timeout = 26

[[redirects]]
  # SPA路由重定向 - 由于使用了Hash路由，这个重定向规则实际上不是必需的
  # 但为了完整性，仍然保留（Hash路由在客户端处理，不经过服务器）
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# 配置响应头，支持跨域请求和优化连接稳定性
[[headers]]
  for = "/*"
  [headers.values]
    # 允许的请求来源（前端域名）
    Access-Control-Allow-Origin = "https://flag.xianbeikeji.com"
    # 允许的请求方法
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    # 允许的请求头（包括自定义的 token 请求头）
    Access-Control-Allow-Headers = "Content-Type, Authorization, token, X-Requested-With, Accept, Origin"
    # 允许携带凭证（cookie等），因为代码中使用了 withCredentials = true
    Access-Control-Allow-Credentials = "true"
    # 预检请求的缓存时间（秒）
    Access-Control-Max-Age = "3600"
    # HTTP/2 和连接复用优化
    Connection = "keep-alive"
    # 安全头配置，避免某些安卓浏览器拒绝连接
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"

# 静态资源（图片、字体等）的响应头配置
[[headers]]
  for = "/assets/*"
  [headers.values]
    # 静态资源长期缓存
    Cache-Control = "public, max-age=31536000, immutable"
    # 连接保持
    Connection = "keep-alive"
    # 内容类型
    X-Content-Type-Options = "nosniff"

# HTML 文件的响应头配置
[[headers]]
  for = "/*.html"
  [headers.values]
    # HTML 文件不缓存，确保更新及时
    Cache-Control = "public, max-age=0, must-revalidate"
    # 连接保持
    Connection = "keep-alive"
    # 安全头
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"

